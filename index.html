<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#000000">
  <title>SELAHX | Apple Liquid Glass Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Three.js 3D 粒子星海画卷容器 (z-index: 1) -->
  <div id="canvas-container"></div>

  <!-- 浮动高级黑白主题切换胶囊 (Light / Dark Mode Switcher) -->
  <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换黑白主题" title="切换明暗色彩主题">
    <span class="theme-toggle-icon-wrap">
      <svg class="theme-icon icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="theme-icon icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </span>
    <span class="theme-toggle-text" id="themeToggleText">DARK</span>
  </button>

  <audio id="bgAudio" preload="auto"></audio>

  
  <div class="scroll-storyboard" id="scrollStoryboard">

    <!-- 首页：纯净 SELAHX 独立品牌视觉 (小字全部删除) -->
    <section class="story-section section-everywhere" id="secEverywhere">
      <div class="everywhere-stage-content">
        <div class="everywhere-stage-anchor" id="lensTriggerBox">
          <h1 class="hero-selahx-title">SELAHX</h1>
        </div>
      </div>
    </section>

    <!-- 典藏画廊 (卡片全部移除，视频彻底删除，纯净大片呈现) -->
    <section class="story-section section-portfolio" id="gallery">
      <div class="portfolio-container">
        <div class="pure-gallery-grid">

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="111.jpg" alt="ALPHA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="DanLevi.webp" alt="DANLEVI" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="selahx1.webp" alt="REED" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="1.WEBP" alt="DANDELION" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_8317.jpeg" alt="BETA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="2.WEBP" alt="ETHEREAL" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_8318.jpeg" alt="GAMMA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="3.WEBP" alt="CHROMA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_2576.jpeg" alt="DELTA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="4.WEBP" alt="PRISM" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_8322.jpeg" alt="EPSILON" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_8329.jpeg" alt="NEBULA" loading="lazy">
          </div>

          <div class="pure-photo-item">
            <img class="pure-photo-img" src="IMG_8340.jpeg" alt="ZETA" loading="lazy">
          </div>

        </div>
      </div>
    </section>

  </div>

  
  <div class="cinema-lightbox" id="cinemaLightbox" role="dialog" aria-modal="true">
    <div class="lightbox-modal-content">
      <img src="" alt="" class="lightbox-main-img" id="lightboxImg">
      <button class="lightbox-close-btn" id="lightboxClose" aria-label="Close Lightbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  
  <aside class="docked-agentic-pill" id="agenticDockPill" title="展开/收起播放器">
    <div class="pill-left-state">
      <span class="pill-label-text">SELAHX</span>
      <span class="pill-track-info" id="dockTrackTitle">SelahX Ambient Resonance</span>
    </div>

    
    <div class="pill-mini-equalizer">
      <div class="mini-eq-bar"></div>
      <div class="mini-eq-bar"></div>
      <div class="mini-eq-bar"></div>
      <div class="mini-eq-bar"></div>
    </div>

    <!-- 胶囊常驻快捷播放/暂停按钮 -->
    <button class="pill-quick-play-btn" id="pillQuickPlayBtn" title="播放 / 暂停" aria-label="Play or Pause">
      <svg class="pill-play-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </button>

    
    <div class="pill-menu-icon" id="pillMenuTrigger" title="展开详细控制面板">
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
    </div>

    
    <div class="pill-expanded-panel" id="pillExpandPanel">
      <div class="expanded-cover-wrapper">
        <img src="selahx.PNG" alt="Cover" class="expanded-cover-img" id="expandedCoverImg">
      </div>
      <div class="expanded-details">
        <span class="expanded-title" id="expandedTitle">SelahX Ambient Resonance</span>
        <span class="expanded-artist" id="expandedArtist">Jesse / Everywhere & Agentic</span>
      </div>
      <div class="expanded-controls">
        <button class="dock-btn" id="dockPrevBtn" title="上一首">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
          </svg>
        </button>
        <button class="dock-btn dock-btn-play" id="dockPlayBtn" title="播放/暂停">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px;">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
        <button class="dock-btn" id="dockNextBtn" title="下一首">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
