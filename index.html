<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#040406">
  <title>SELAHX</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D 黄金麦田大地舞台：金黄麦浪 + 体育场繁星看台 + 舞台流云 + 金辉 SELAHX 徽标 -->
  <div id="canvas-container"></div>
  <div class="stage-ambient-vignette"></div>

  <!-- 背景音频元素 -->
  <audio id="bgAudio" preload="auto" crossorigin="anonymous"></audio>

  <!-- 页面滚动视差层 (全透明流体融合) -->
  <div class="scroll-viewport">

    <!-- 首屏留白：完整沉浸欣赏 Kanye 同款黄金麦浪大地与星光舞台 -->
    <div class="hero-stage-spacer">
      <div class="scroll-whisper">
        <div class="scroll-track"></div>
        <span>SCROLL TO EXPLORE</span>
      </div>
    </div>

    <main class="main-content">

      <!-- 动态视频展区 (VD.webm) - 苹果 iOS 27 液态玻璃影院卡片 -->
      <section class="cinema-container">
        <div class="liquid-glass-card liquid-cinema-card">
          <div class="cinema-media-tray">
            <video class="cinema-video-element" autoplay loop muted playsinline poster="111.jpg">
              <source src="VD.webm" type="video/webm">
            </video>
            <div class="cinema-floating-pill">4K MOTION CINEMA</div>
          </div>
        </div>
      </section>

      <!-- 纯粹典藏画廊 (全部13张高清大片，苹果 iOS 27 液态玻璃材质) -->
      <section class="gallery-wrapper">
        <div class="gallery-grid">

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="111.jpg" alt="ALPHA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">ALPHA</span>
              <span class="photo-index">01 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="DanLevi.webp" alt="DANLEVI 磐石" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">DANLEVI 磐石</span>
              <span class="photo-index">02 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="selahx1.webp" alt="REED 芦苇" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">REED 芦苇</span>
              <span class="photo-index">03 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="1.WEBP" alt="DANDELION 蒲公英" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">DANDELION</span>
              <span class="photo-index">04 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_8317.jpeg" alt="BETA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">BETA</span>
              <span class="photo-index">05 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="2.WEBP" alt="ETHEREAL" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">ETHEREAL</span>
              <span class="photo-index">06 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_8318.jpeg" alt="GAMMA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">GAMMA</span>
              <span class="photo-index">07 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="3.WEBP" alt="CHRONICLE" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">CHRONICLE</span>
              <span class="photo-index">08 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_8322.jpeg" alt="DELTA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">DELTA</span>
              <span class="photo-index">09 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="4.WEBP" alt="HORIZON" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">HORIZON</span>
              <span class="photo-index">10 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_8329.jpeg" alt="EPSILON" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">EPSILON</span>
              <span class="photo-index">11 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_8340.jpeg" alt="ZETA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">ZETA</span>
              <span class="photo-index">12 / 13</span>
            </div>
          </article>

          <article class="liquid-glass-card liquid-photo-card">
            <div class="photo-tray">
              <img class="photo-inner-img" src="IMG_2576.jpeg" alt="AURA" loading="lazy">
            </div>
            <div class="photo-meta-bar">
              <span class="photo-title">AURA</span>
              <span class="photo-index">13 / 13</span>
            </div>
          </article>

        </div>
      </section>

    </main>
  </div>

  <!-- 全屏沉浸式影院灯箱 (点击任意照片弹出，点击关闭) -->
  <div class="cinema-lightbox" id="cinemaLightbox" role="dialog" aria-modal="true">
    <div class="lightbox-content-tray">
      <img src="" alt="" class="lightbox-main-photo" id="lightboxImg">
      <button class="lightbox-close-icon" id="lightboxClose" aria-label="Close Lightbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- 苹果 iOS 27 液态玻璃灵动岛播放器 (Liquid Dynamic Island) -->
  <aside class="liquid-dynamic-island" id="liquidDynamicIsland">
    <div class="island-cover-wrapper">
      <img src="selahx.PNG" alt="Album Cover" class="island-cover-img">
    </div>

    <div class="island-info-box">
      <span class="island-track-name" id="islandTrackName">SelahX Ambient Resonance</span>
      <span class="island-artist-name" id="islandArtistName">Jesse / Haikou Golden Wheat</span>
    </div>

    <!-- 麦浪金辉频谱条 -->
    <div class="island-equalizer-bars">
      <div class="eq-column"></div>
      <div class="eq-column"></div>
      <div class="eq-column"></div>
      <div class="eq-column"></div>
      <div class="eq-column"></div>
    </div>

    <div class="island-btn-group">
      <button class="liquid-ctrl-btn" id="islandPrevBtn" title="上一曲" aria-label="Previous Track">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>

      <button class="liquid-ctrl-btn liquid-ctrl-btn-play" id="islandPlayBtn" title="播放 / 暂停" aria-label="Play or Pause">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 2px;">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>

      <button class="liquid-ctrl-btn" id="islandNextBtn" title="下一曲" aria-label="Next Track">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
